[versions]
agp = "8.5.1"
kotlin = "1.9.0"
junit = "4.13.2"
junitVersion = "1.2.1"
espressoCore = "3.6.1"
logbackAndroid = "2.0.0"
reactNative = "0.20.1"
slf4jApi = "1.7.28"
localMavenVersion = "1.0.0"
coreKtx = "1.13.1"
appcompat = "1.7.0"
material = "1.12.0"
activity = "1.9.0"
constraintlayout = "2.1.4"

[libraries]
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
local-dtfmobile-debug = { module = "linx:dtefmobile-debug", version.ref = "localMavenVersion" }
local-dtfmobile-release = { module = "linx:dtefmobile-release", version.ref = "localMavenVersion" }
local-linxpay-sdk = { module = "linx:linxpay-sdk", version.ref = "localMavenVersion" }
local-log-manager = { module = "linx:log-manager", version.ref = "localMavenVersion" }
logback-android = { module = "com.github.tony19:logback-android", version.ref = "logbackAndroid" }
react-native = { module = "com.facebook.react:react-native", version.ref = "reactNative" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4jApi" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
jetbrains-kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
android-application = { id = "com.android.application", version.ref = "agp" }

